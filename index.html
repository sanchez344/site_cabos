<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Guia Visual de Redes para Automação | Industrial Tech</title>
    <!-- Tailwind CSS via CDN + Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter + JetBrains Mono) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Custom CSS para efeitos industriais -->
    <style>
        * {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        body {
            background-color: #0E1217;
        }
        /* Efeito de elevação nos cards */
        .card-hover {
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            cursor: pointer;
        }
        .card-hover:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 255, 255, 0.25);
        }
        /* Card ativo (selecionado) */
        .card-active {
            border: 2px solid #00E5FF;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
            background: #1A2C34;
        }
        /* Scrollbar industrial */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1E262F;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A9D8F;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00E5FF;
        }
        /* Badges */
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid;
        }
        .badge-green {
            border-color: rgba(16, 185, 129, 0.5);
            color: #6EE7B7;
            background: rgba(6, 78, 59, 0.4);
        }
        .badge-cyan {
            border-color: rgba(0, 229, 255, 0.5);
            color: #67E8F9;
            background: rgba(8, 145, 178, 0.3);
        }
        /* Animações */
        .fade-in {
            animation: fadeSlideUp 0.3s ease-out;
        }
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Botões de navegação */
        button.topo-btn-active {
            border-bottom: 2px solid #00E5FF;
            color: #00E5FF;
            background: #1A2C34;
        }
        button.topo-btn-inactive {
            color: #C0D4E6;
            border-bottom: 2px solid transparent;
        }
        button.topo-btn-inactive:hover {
            background: #1F2A32;
            border-bottom: 2px solid #2A9D8F;
            color: #E6F7FF;
        }
        /* Simulador de topologia mini representação */
        .network-node {
            transition: all 0.2s;
            box-shadow: 0 0 0 1px rgba(0,255,200,0.3), 0 2px 6px rgba(0,0,0,0.4);
        }
        .switch-node {
            background: #0D3B66;
            border: 2px solid #00E5FF;
            box-shadow: 0 0 8px #00e5ff60;
        }
        .machine-node {
            background: #1E6F5C;
            border: 1px solid #2A9D8F;
        }
        .bus-line {
            background: linear-gradient(90deg, #5E8B7E, #9BB8AE);
            height: 4px;
            border-radius: 4px;
        }
        .mini-topology {
            background: #0A0F14;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: inset 0 0 0 1px #2E3A44, 0 10px 20px -5px black;
        }
        /* Responsividade do grid de cards */
        @media (max-width: 780px) {
            .grid-cards {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
        /* Estilo do painel de detalhes */
        .detail-panel {
            background: #16222B;
            border: 1px solid #2E4A5C;
            border-radius: 1rem;
            transition: all 0.2s;
        }
        .detail-panel img {
            max-height: 180px;
            object-fit: cover;
            border-radius: 0.75rem;
            width: 100%;
        }
        .close-detail-btn {
            transition: all 0.2s;
        }
        .close-detail-btn:hover {
            background: rgba(229, 62, 62, 0.2);
            color: #F87171;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="text-gray-200 antialiased">

    <div class="max-w-6xl mx-auto px-4 md:px-6 py-6 md:py-8">
        <!-- Header industrial -->
        <div class="mb-8 border-b border-cyan-800/40 pb-4 flex flex-wrap justify-between items-end">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold tracking-tight bg-gradient-to-r from-cyan-300 to-emerald-300 bg-clip-text text-transparent">⚙️ Guia Visual de Redes</h1>
                <p class="text-gray-400 text-sm font-mono mt-1">para Automação Industrial — técnicos e eletricistas iniciantes</p>
            </div>
            <div class="text-xs text-cyan-400/70 font-mono mt-2 md:mt-0">SCADA READY • PROTOCOLO INDUSTRIAL</div>
        </div>

        <!-- Navegação Abas -->
        <div class="flex gap-2 md:gap-4 border-b border-gray-800 mb-8">
            <button id="tabMeiosBtn" class="tab-button px-5 py-2.5 text-base font-semibold rounded-t-xl transition-all duration-200 flex items-center gap-2 topo-btn-active">
                <span>🔌</span> Meios Físicos (Cabos)
            </button>
            <button id="tabSimuladorBtn" class="tab-button px-5 py-2.5 text-base font-semibold rounded-t-xl transition-all duration-200 flex items-center gap-2 topo-btn-inactive">
                <span>📐</span> Simulador de Topologia
            </button>
        </div>

        <!-- CONTEÚDO DA ABA 1: MEIOS FÍSICOS -->
        <div id="tabMeiosContent" class="tab-content fade-in">
            <!-- Grid de 3 cards (limpos: apenas nome e ícone) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8" id="cardsGrid">
                <!-- Card Par Trançado -->
                <div class="card-item bg-[#131C23] rounded-2xl p-6 border border-gray-800 card-hover text-center transition-all" data-card-type="par">
                    <div class="flex flex-col items-center gap-3">
                        <span class="text-5xl">🪢</span>
                        <h2 class="text-xl font-bold text-cyan-300">Par Trançado</h2>
                        <span class="text-xs text-gray-500 font-mono">CLIQUE PARA DETALHES</span>
                    </div>
                </div>
                <!-- Card Fibra Óptica -->
                <div class="card-item bg-[#131C23] rounded-2xl p-6 border border-gray-800 card-hover text-center transition-all" data-card-type="fibra">
                    <div class="flex flex-col items-center gap-3">
                        <span class="text-5xl">🔮</span>
                        <h2 class="text-xl font-bold text-cyan-300">Fibra Óptica</h2>
                        <span class="text-xs text-gray-500 font-mono">CLIQUE PARA DETALHES</span>
                    </div>
                </div>
                <!-- Card Wireless -->
                <div class="card-item bg-[#131C23] rounded-2xl p-6 border border-gray-800 card-hover text-center transition-all" data-card-type="wireless">
                    <div class="flex flex-col items-center gap-3">
                        <span class="text-5xl">📡</span>
                        <h2 class="text-xl font-bold text-cyan-300">Wireless</h2>
                        <span class="text-xs text-gray-500 font-mono">CLIQUE PARA DETALHES</span>
                    </div>
                </div>
            </div>

            <!-- Painel de Detalhes (inicialmente oculto) -->
            <div id="detailPanel" class="detail-panel mt-8 p-5 hidden transition-all duration-300">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="detailTitle" class="text-2xl font-bold text-cyan-300 flex items-center gap-2"></h3>
                    <button id="closeDetailBtn" class="close-detail-btn text-gray-400 hover:text-red-400 text-2xl leading-5 w-8 h-8 rounded-full flex items-center justify-center transition-all">✕</button>
                </div>
                <div class="flex flex-col md:flex-row gap-6">
                    <!-- Imagem (caminho relativo para pasta imagens) -->
                    <div class="md:w-1/2">
                        <img id="detailImage" src="" alt="Imagem do cabo" class="rounded-xl border border-cyan-500/30 shadow-lg w-full object-cover bg-black/30">
                    </div>
                    <!-- Texto e badges -->
                    <div class="md:w-1/2 flex flex-col justify-between">
                        <div>
                            <p id="detailText" class="text-gray-200 text-base leading-relaxed mb-5"></p>
                            <div id="detailBadges" class="flex flex-wrap gap-3 mt-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTEÚDO DA ABA 2: SIMULADOR DE TOPOLOGIA -->
        <div id="tabSimuladorContent" class="tab-content hidden fade-in">
            <div class="bg-[#11161C] rounded-2xl border border-gray-800 p-6 md:p-8">
                <div class="flex flex-wrap gap-5 justify-center md:justify-start mb-10">
                    <button id="btnBarramento" class="px-6 py-3 rounded-xl font-bold text-base transition-all bg-[#1C2A34] hover:bg-cyan-900/50 text-cyan-200 border border-cyan-500/40 shadow-lg flex items-center gap-2">
                        <span class="text-xl">🔗</span> Layout em Barramento
                    </button>
                    <button id="btnEstrela" class="px-6 py-3 rounded-xl font-bold text-base transition-all bg-[#1C2A34] hover:bg-emerald-900/40 text-emerald-200 border border-emerald-500/40 shadow-lg flex items-center gap-2">
                        <span class="text-xl">⭐</span> Layout em Estrela
                    </button>
                </div>
                
                <!-- Painel de exibição da topologia -->
                <div id="topologyDisplay" class="mini-topology transition-all">
                    <!-- Conteúdo será preenchido dinamicamente -->
                </div>
                <!-- Área de vantagens / desvantagens -->
                <div id="topologyDetails" class="mt-6 bg-[#0C1117] rounded-xl p-5 border-l-4 border-cyan-500/70">
                    <!-- dinâmico -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ------------------- Controle de abas -------------------
        const tabMeiosBtn = document.getElementById('tabMeiosBtn');
        const tabSimuladorBtn = document.getElementById('tabSimuladorBtn');
        const contentMeios = document.getElementById('tabMeiosContent');
        const contentSimulador = document.getElementById('tabSimuladorContent');
        const detailPanel = document.getElementById('detailPanel');
        
        function setActiveTab(tab) {
            tabMeiosBtn.classList.remove('topo-btn-active');
            tabMeiosBtn.classList.add('topo-btn-inactive');
            tabSimuladorBtn.classList.remove('topo-btn-active');
            tabSimuladorBtn.classList.add('topo-btn-inactive');
            
            if (tab === 'meios') {
                tabMeiosBtn.classList.remove('topo-btn-inactive');
                tabMeiosBtn.classList.add('topo-btn-active');
                contentMeios.classList.remove('hidden');
                contentSimulador.classList.add('hidden');
                // Ao voltar para meios, se o detailPanel estiver visível, mantém (melhor usabilidade)
                // apenas não faz nada, detalhes permanecem se aberto
            } else {
                tabSimuladorBtn.classList.remove('topo-btn-inactive');
                tabSimuladorBtn.classList.add('topo-btn-active');
                contentMeios.classList.add('hidden');
                contentSimulador.classList.remove('hidden');
                // Renderizar topologia padrão se estiver vazia
                const displayDiv = document.getElementById('topologyDisplay');
                if (displayDiv && displayDiv.innerHTML.trim() === '') {
                    renderTopology('barramento');
                }
            }
        }
        
        tabMeiosBtn.addEventListener('click', () => setActiveTab('meios'));
        tabSimuladorBtn.addEventListener('click', () => setActiveTab('simulador'));
        
        // ------------------- Lógica dos Cards (limpos + painel de detalhes) -------------------
        const cards = document.querySelectorAll('.card-item');
        const detailTitleSpan = document.getElementById('detailTitle');
        const detailImage = document.getElementById('detailImage');
        const detailTextP = document.getElementById('detailText');
        const detailBadgesDiv = document.getElementById('detailBadges');
        const closeDetailBtn = document.getElementById('closeDetailBtn');
        
        // Função para remover a classe 'card-active' de todos os cards
        function removeActiveClass() {
            cards.forEach(card => {
                card.classList.remove('card-active');
                card.style.border = '';
                card.style.boxShadow = '';
            });
        }
        
        // Função para exibir detalhes do card selecionado
        function showCardDetails(cardType) {
            // Armazena o tipo atual para referência
            let title = '';
            let imageSrc = '';
            let description = '';
            let badgesHtml = '';
            
            if (cardType === 'par') {
                title = '🔹 Par Trançado (UTP / STP)';
                imageSrc = 'imagens/par-trancado.jpg';
                description = 'Cabo de rede comum (Ethernet/Profinet). Usado para ligar o CLP ao computador do supervisor, além de conectar switches, IHMs e dispositivos de campo em distâncias de até 100 metros.';
                badgesHtml = `
                    <span class="badge badge-green">💰 Custo: Baixo</span>
                    <span class="badge badge-cyan">⚡ Flexibilidade: Alta</span>
                `;
            } 
            else if (cardType === 'fibra') {
                title = '🔹 Fibra Óptica (Monomodo / Multimodo)';
                imageSrc = 'imagens/fibra.jpg';
                description = 'O cabo de vidro. Usado para levar dados a longas distâncias na fábrica sem sofrer com a interferência dos motores elétricos, inversores e campos eletromagnéticos severos. Ideal para interligar subestações e CCMs.';
                badgesHtml = `
                    <span class="badge badge-cyan">🛡️ Imunidade a Ruídos: Excelente</span>
                    <span class="badge bg-red-950/50 text-red-300 border-red-800/60">💰 Custo: Alto</span>
                `;
            }
            else if (cardType === 'wireless') {
                title = '🔹 Rede Sem Fio (Wireless Industrial)';
                imageSrc = 'imagens/wireless.jpg';
                description = 'Rede sem fio. Usado para monitorar sensores que ficam em locais móveis ou de difícil acesso, como pontes rolantes, AGVs, robôs móveis. Necessita planejamento de canais e pontos de acesso industriais.';
                badgesHtml = `
                    <span class="badge badge-green">🏃 Mobilidade: Máxima</span>
                    <span class="badge bg-amber-950/40 text-amber-300 border-amber-700">⚠️ Sujeito a Barreiras</span>
                `;
            }
            
            // Preenche o painel
            detailTitleSpan.innerHTML = title;
            detailImage.src = imageSrc;
            detailImage.alt = `Imagem ilustrativa de ${title}`;
            // Caso a imagem não exista, adiciona um evento para fallback (não quebrar layout)
            detailImage.onerror = function() {
                this.src = 'https://placehold.co/600x400/1E293B/00E5FF?text=Imagem+Não+Encontrada';
                this.alt = 'Imagem indisponível';
            };
            detailTextP.innerHTML = description;
            detailBadgesDiv.innerHTML = badgesHtml;
            
            // Exibe o painel com animação suave
            detailPanel.classList.remove('hidden');
            detailPanel.classList.add('fade-in');
            // Scroll suave para o painel
            detailPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        // Eventos de clique nos cards
        cards.forEach(card => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                const cardType = card.getAttribute('data-card-type');
                // Remove a classe ativa de todos os cards
                removeActiveClass();
                // Adiciona classe de destaque no card clicado
                card.classList.add('card-active');
                // Mostra os detalhes correspondentes
                showCardDetails(cardType);
            });
        });
        
        // Fechar painel de detalhes
        closeDetailBtn.addEventListener('click', () => {
            detailPanel.classList.add('hidden');
            // Remove a classe ativa dos cards para limpar a interface
            removeActiveClass();
        });
        
        // Se o usuário clicar fora, opcional? mantemos só o X para simplicidade e usabilidade industrial.
        
        // ------------------- SIMULADOR DE TOPOLOGIA (Lógica Completa) -------------------
        const btnBarramento = document.getElementById('btnBarramento');
        const btnEstrela = document.getElementById('btnEstrela');
        const topologyDisplayDiv = document.getElementById('topologyDisplay');
        const topologyDetailsDiv = document.getElementById('topologyDetails');
        
        function renderTopology(type) {
            if (type === 'barramento') {
                const visualHtml = `
                    <div class="flex flex-col items-center">
                        <div class="text-xs font-mono text-cyan-400 mb-2">🔷 TOPOLOGIA EM BARRA (Linear) - Bus</div>
                        <div class="relative w-full flex justify-center items-center gap-1 flex-wrap">
                            <div class="flex items-center gap-1 sm:gap-3 bg-[#0D141A] p-4 rounded-xl w-full justify-center flex-wrap">
                                <div class="network-node machine-node w-14 h-14 rounded-lg flex items-center justify-center text-center text-xs font-bold shadow-md">M1</div>
                                <div class="bus-line w-8 sm:w-12"></div>
                                <div class="network-node machine-node w-14 h-14 rounded-lg flex items-center justify-center text-center text-xs font-bold shadow-md">M2</div>
                                <div class="bus-line w-8 sm:w-12"></div>
                                <div class="network-node machine-node w-14 h-14 rounded-lg flex items-center justify-center text-center text-xs font-bold shadow-md">M3</div>
                                <div class="bus-line w-8 sm:w-12"></div>
                                <div class="network-node machine-node w-14 h-14 rounded-lg flex items-center justify-center text-center text-xs font-bold shadow-md">M4</div>
                            </div>
                        </div>
                        <p class="text-gray-300 text-sm mt-4 max-w-lg text-center">Cabo principal compartilhado → máquinas conectadas em série (como vagões de trem).</p>
                    </div>
                `;
                const details = {
                    title: "📡 Topologia Barramento (Bus)",
                    description: "As máquinas são ligadas uma na outra em linha (como vagões de trem). Se o cabo partir no meio, metade da fábrica para. Utilizado em redes mais antigas ou em aplicações específicas como RS-485/Modbus.",
                    advantages: [
                        "✅ Cabo econômico para pequenas distâncias",
                        "✅ Simples de instalar em linha de produção sequencial",
                        "✅ Baixo custo de infraestrutura passiva"
                    ],
                    disadvantages: [
                        "❌ Ponto único de falha: quebra no cabo afeta toda a rede após a ruptura",
                        "❌ Baixa escalabilidade e difícil manutenção",
                        "❌ Problemas de reflexão e terminação exigem cuidados"
                    ]
                };
                topologyDisplayDiv.innerHTML = visualHtml;
                topologyDisplayDiv.setAttribute('data-loaded', 'barramento');
                topologyDetailsDiv.innerHTML = `
                    <h3 class="text-xl font-bold text-cyan-300 mb-3">${details.title}</h3>
                    <p class="text-gray-300 text-sm md:text-base mb-4">${details.description}</p>
                    <div class="grid md:grid-cols-2 gap-4 mt-2">
                        <div class="bg-[#14222B] p-4 rounded-lg border-l-4 border-emerald-400">
                            <h4 class="font-bold text-emerald-300 flex items-center gap-1">📈 Vantagens</h4>
                            <ul class="list-disc list-inside text-gray-300 text-sm mt-2 space-y-1">${details.advantages.map(a => `<li>${a}</li>`).join('')}</ul>
                        </div>
                        <div class="bg-[#1C1A24] p-4 rounded-lg border-l-4 border-rose-400">
                            <h4 class="font-bold text-rose-300 flex items-center gap-1">⚠️ Desvantagens</h4>
                            <ul class="list-disc list-inside text-gray-300 text-sm mt-2 space-y-1">${details.disadvantages.map(d => `<li>${d}</li>`).join('')}</ul>
                        </div>
                    </div>
                `;
            } 
            else if (type === 'estrela') {
                const visualHtml = `
                    <div class="flex flex-col items-center">
                        <div class="text-xs font-mono text-emerald-300 mb-2">⭐ TOPOLOGIA EM ESTRELA (Switch Central)</div>
                        <div class="relative flex justify-center min-h-[200px]">
                            <div class="relative flex flex-wrap justify-center items-center gap-6 md:gap-10 bg-[#0D141A] p-6 rounded-xl w-full">
                                <!-- Switch central -->
                                <div class="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10">
                                    <div class="switch-node w-20 h-20 rounded-xl flex items-center justify-center font-bold text-cyan-100 shadow-2xl">SWITCH</div>
                                </div>
                                <!-- Máquinas ao redor em grid -->
                                <div class="grid grid-cols-2 gap-x-14 gap-y-12 mt-8 mb-8 relative" style="width:280px">
                                    <div class="network-node machine-node w-14 h-14 rounded-lg flex items-center justify-center font-bold z-20 relative shadow-md">M1</div>
                                    <div class="network-node machine-node w-14 h-14 rounded-lg flex items-center justify-center font-bold z-20 relative shadow-md">M2</div>
                                    <div class="network-node machine-node w-14 h-14 rounded-lg flex items-center justify-center font-bold z-20 relative shadow-md">M3</div>
                                    <div class="network-node machine-node w-14 h-14 rounded-lg flex items-center justify-center font-bold z-20 relative shadow-md">M4</div>
                                </div>
                            </div>
                        </div>
                        <p class="text-gray-300 text-sm mt-4 text-center">Todas as máquinas ligam a um Switch central. Falha em um ponto não afeta os demais.</p>
                    </div>
                `;
                const details = {
                    title: "⭐ Topologia Estrela (Star)",
                    description: "Todas as máquinas ligam em um aparelho central (Switch Industrial). Se uma máquina estragar, as outras continuam funcionando normalmente. É a topologia mais comum em redes Ethernet industriais modernas.",
                    advantages: [
                        "✅ Isolamento de falhas: defeito em um dispositivo não derruba os outros",
                        "✅ Alta escalabilidade e fácil expansão com switches adicionais",
                        "✅ Diagnóstico simplificado, tráfego eficiente"
                    ],
                    disadvantages: [
                        "❌ Dependência do switch central (se falhar toda a rede para)",
                        "❌ Maior custo com switch e cabeamento estruturado",
                        "❌ Distância limitada por enlace individual (100m Ethernet)"
                    ]
                };
                topologyDisplayDiv.innerHTML = visualHtml;
                topologyDisplayDiv.setAttribute('data-loaded', 'estrela');
                topologyDetailsDiv.innerHTML = `
                    <h3 class="text-xl font-bold text-cyan-300 mb-3">${details.title}</h3>
                    <p class="text-gray-300 text-sm md:text-base mb-4">${details.description}</p>
                    <div class="grid md:grid-cols-2 gap-4 mt-2">
                        <div class="bg-[#14222B] p-4 rounded-lg border-l-4 border-emerald-400">
                            <h4 class="font-bold text-emerald-300 flex items-center gap-1">📈 Vantagens</h4>
                            <ul class="list-disc list-inside text-gray-300 text-sm mt-2 space-y-1">${details.advantages.map(a => `<li>${a}</li>`).join('')}</ul>
                        </div>
                        <div class="bg-[#1C1A24] p-4 rounded-lg border-l-4 border-rose-400">
                            <h4 class="font-bold text-rose-300 flex items-center gap-1">⚠️ Desvantagens</h4>
                            <ul class="list-disc list-inside text-gray-300 text-sm mt-2 space-y-1">${details.disadvantages.map(d => `<li>${d}</li>`).join('')}</ul>
                        </div>
                    </div>
                `;
            }
        }
        
        btnBarramento.addEventListener('click', () => renderTopology('barramento'));
        btnEstrela.addEventListener('click', () => renderTopology('estrela'));
        
        // Inicialização: garantir que ao clicar no simulador mostre barramento padrão se vazio
        const observer = new MutationObserver(() => {
            if (!contentSimulador.classList.contains('hidden') && (!topologyDisplayDiv.innerHTML || topologyDisplayDiv.innerHTML.trim() === '')) {
                renderTopology('barramento');
            }
        });
        observer.observe(contentSimulador, { attributes: true, attributeFilter: ['class'] });
        
        // Se a página abrir com a aba simulador já ativa (caso raro, mas seguro)
        if (!contentSimulador.classList.contains('hidden') && topologyDisplayDiv.innerHTML.trim() === '') {
            renderTopology('barramento');
        }
        
        // Pré-carregar fallback para imagens: não quebrar layout caso não existam
        // apenas tratamento inline no erro da imagem
    </script>
</body>
</html>
